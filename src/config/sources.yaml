# ----------------------------------------------------------
# 直接抓取
# ----------------------------------------------------------
scraper:
  - name: GitHub Trending
    url: "https://github.com/trending?since=daily"
    category: tech_ai
    parser: html
    selector: "article.Box-row"
    max_items: 10

# ----------------------------------------------------------
# Tavily 搜索
# ----------------------------------------------------------
tavily:
  tech_ai:
    - name: AI 最新进展
      query: "AI agent 最新进展 本周"
      category: tech_ai
      search_depth: basic
      max_results: 5

    - name: Product Hunt 热门
      query: "Product Hunt top launches this week"
      category: tech_ai
      search_depth: basic
      max_results: 5

  auto:
    - name: 懂车帝资讯
      query: "懂车帝 新车 评测"
      category: auto
      search_depth: basic
      max_results: 5

    - name: 汽车之家
      query: "汽车之家 新车 本周"
      category: auto
      search_depth: basic
      max_results: 5

    - name: 36kr 汽车
      query: "36kr 汽车 新能源"
      category: auto
      search_depth: basic
      max_results: 5

    - name: 新能源政策
      query: "新能源汽车 政策 补贴"
      category: auto
      search_depth: basic
      max_results: 5

    - name: 智能驾驶周报
      query: "智能驾驶 智驾 本周 新车 评测"
      category: auto
      search_depth: advanced
      max_results: 5

    - name: 新能源销量
      query: "新能源汽车 销量 本周 比亚迪 理想 小鹏 问界"
      category: auto
      search_depth: advanced
      max_results: 5

    - name: 充电与补能
      query: "充电桩 换电 超充 新能源汽车 本周"
      category: auto
      search_depth: basic
      max_results: 5

    - name: 小米与华为汽车
      query: "小米汽车 华为 问界 智驾 本周"
      category: auto
      search_depth: advanced
      max_results: 5

  trending:
    - name: 微博热搜
      query: "微博热搜 科技 汽车"
      category: trending
      search_depth: basic
