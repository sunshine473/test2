# 发布平台配置
# 敏感信息从 .env 环境变量读取

wechat:
  enabled: false
  # WECHAT_APP_ID / WECHAT_APP_SECRET 从 .env 读取

bilibili:
  enabled: false
  # BILIBILI_SESSDATA / BILIBILI_BILI_JCT 从 .env 读取
  category: 17  # 科技分区

zhihu:
  enabled: false
  # headless 本地默认 false（手动登录），CI 自动切换 true（依赖 ZHIHU_COOKIE secret）

toutiao:
  enabled: false

xiaohongshu:
  enabled: false
  # headless 本地默认 false（手动扫码），CI 自动切换 true（依赖 XIAOHONGSHU_COOKIE secret）

dongchedi:
  enabled: true
  # headless 本地默认 false（手动扫码），CI 自动切换 true（依赖 DONGCHEDI_COOKIE secret）
