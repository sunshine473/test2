name: Telegram Bot

on:
  schedule:
    - cron: '*/2 * * * *'    # 每 2 分钟轮询
  workflow_dispatch:           # 支持手动触发

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: telegram-bot
      cancel-in-progress: true

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      BOT_STATE_DIR: /tmp/bot_state

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            src/collector/requirements.txt
            src/publisher/requirements.txt
            src/generator/requirements.txt
            src/bot/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r src/collector/requirements.txt
          pip install -r src/publisher/requirements.txt
          pip install -r src/generator/requirements.txt
          pip install -r src/bot/requirements.txt

      - name: Restore offset cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bot_state
          key: bot-offset-${{ github.run_id }}
          restore-keys: bot-offset-

      - name: Run bot
        working-directory: src
        env:
          PYTHONPATH: .
        run: python -m bot.main

      - name: Save offset cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/bot_state
          key: bot-offset-${{ github.run_id }}
