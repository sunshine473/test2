name: 每日全自动内容流水线

on:
  schedule:
    - cron: '0 2 * * *'  # UTC 2:00 = 北京时间 10:00
  workflow_dispatch:       # 支持手动触发

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 采集器相关
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 生成器相关（Claude API）
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 发布器相关
      WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
      WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
      BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
      ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
      TOUTIAO_COOKIE: ${{ secrets.TOUTIAO_COOKIE }}
      XIAOHONGSHU_COOKIE: ${{ secrets.XIAOHONGSHU_COOKIE }}
      DONGCHEDI_COOKIE: ${{ secrets.DONGCHEDI_COOKIE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r src/collector/requirements.txt
          pip install -r src/generator/requirements.txt
          pip install -r src/publisher/requirements.txt

      - name: Run full pipeline
        working-directory: src
        env:
          PYTHONPATH: .
        run: |
          python -m pipeline.main \
            --auto \
            --sources hn,github,hot,youtube \
            --direction tech_ai \
            --platforms wechat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            content/pool/*.json
            content/drafts/*.md
            content/drafts/*.html
            .pipeline/*.json
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          python -c "
          import os
          import requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          message = f'❌ 每日流水线执行失败\n\n时间: {os.environ[\"GITHUB_RUN_ID\"]}\n查看: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': message})
          "
