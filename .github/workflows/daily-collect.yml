name: 每日素材采集（两方向）

on:
  schedule:
    - cron: '0 2 * * *'  # UTC 2:00 = 北京时间 10:00
  workflow_dispatch:       # 支持手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/collector/requirements.txt

      - name: Install dependencies
        run: pip install -r src/collector/requirements.txt

      - name: Run collector (两方向都采集)
        working-directory: src
        env:
          PYTHONPATH: .
        run: |
          # 采集素材（搜索 + 两方向策划）
          # 不指定 --direction，默认会跑 tech_ai 和 auto 两个方向
          # 纳入 rss/tavily，避免汽车方向只剩热搜关键词可选
          python -m collector.main --sources rss,hn,github,hot,tavily,youtube_api

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-${{ github.run_number }}
          path: content/pool/*.json
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          python -c "
          import os
          import requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          message = '❌ 每日采集失败\n\n查看: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': message})
          "
